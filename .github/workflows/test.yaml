name: test
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "charts/**"
      - "docs/**"
      - "hack/**"
      - "logos/**"
      - "rfcs/**"
      - "tools/**"
      - "*.md"
  push:
    branches:
      - main

permissions:
  contents: read # for actions/checkout to fetch code

jobs:
  test-1x-2x:
    name: "Controller Tests: 10->29"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0000[12]"
  test-3x-5x:
    name: "Controller Tests: 30->59"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0000[345]"
  test-6x-9x:
    name: "Controller Tests: 60->99"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0000[6789]"
  test-1xx:
    name: "Controller Tests: 1xx"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0001"
  test-2xx:
    name: "Controller Tests: 2xx"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0002"
  test-3xx:
    name: "Controller Tests: 3xx"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0003"
  test-40x-42x:
    name: "Controller Tests: 40x-42x"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0004[0-2]"
      timeout-minutes: 40
  test-43x-46x:
    name: "Controller Tests: 43x-46x"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0004[3-6]"
      timeout-minutes: 40
  test-99xx:
    name: "Controller Tests: 99xx"
    uses: ./.github/workflows/targeted-test.yaml
    with:
      pattern: "^Test_0099"
  non-numbered:
    name: "Controller Tests: Non-numbered"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Setup OpenTofu
        run: |
          export TOFU_VERSION=1.12.1
          wget https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip
          unzip -q tofu_${TOFU_VERSION}_linux_amd64.zip tofu
          mv tofu /usr/local/bin
          tofu --version
      - name: Setup Kustomize
        if: "!github.event.pull_request.head.repo.fork"
        uses: fluxcd/pkg/actions/kustomize@4bf3ea935541baf8b254aa52aeff62335b563113 # main
      - name: Run tests
        run: |
          make install-envtest
          make normal-controller-test
  internal:
    name: "Internal Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Setup OpenTofu
        run: |
          export TOFU_VERSION=1.12.1
          wget https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip
          unzip -q tofu_${TOFU_VERSION}_linux_amd64.zip tofu
          mv tofu /usr/local/bin
          tofu --version
      - name: Setup Kustomize
        if: "!github.event.pull_request.head.repo.fork"
        uses: fluxcd/pkg/actions/kustomize@4bf3ea935541baf8b254aa52aeff62335b563113 # main
      - name: Run tests
        run: |
          make install-envtest
          make test-internal
  runner:
    name: "Runner Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Setup OpenTofu
        run: |
          export TOFU_VERSION=1.12.1
          wget https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip
          unzip -q tofu_${TOFU_VERSION}_linux_amd64.zip tofu
          mv tofu /usr/local/bin
          tofu --version
      - name: Setup Kustomize
        if: "!github.event.pull_request.head.repo.fork"
        uses: fluxcd/pkg/actions/kustomize@4bf3ea935541baf8b254aa52aeff62335b563113 # main
      - name: Run tests
        run: |
          make install-envtest
          make test-runner
  plan:
    name: "Plan Package Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Run tests
        run: make test-plan
