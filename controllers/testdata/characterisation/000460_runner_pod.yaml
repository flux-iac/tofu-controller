metadata:
  labels:
    app.kubernetes.io/created-by: tofu-controller
    app.kubernetes.io/instance: tf-runner-b8e362c2
    app.kubernetes.io/name: tf-runner
    infra.contrib.fluxcd.io/terraform: flux-system
    tf.weave.works/tls-secret-name: <tls-secret>
  name: char-000460-tf-tf-runner
  namespace: flux-system
  ownerReferences:
  - apiVersion: infra.contrib.fluxcd.io/v1alpha2
    controller: true
    kind: Terraform
    name: char-000460-tf
    uid: <uid>
spec:
  containers:
  - args:
    - --grpc-port
    - "30000"
    - --tls-secret-name
    - <tls-secret>
    - --grpc-max-message-size
    - "4"
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    image: ghcr.io/flux-iac/tf-runner:latest
    imagePullPolicy: IfNotPresent
    name: tf-runner
    ports:
    - containerPort: 30000
      name: grpc
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - mountPath: /tmp
      name: temp
    - mountPath: /home/runner
      name: home
  serviceAccountName: tf-runner
  terminationGracePeriodSeconds: 30
  volumes:
  - emptyDir: {}
    name: temp
  - emptyDir: {}
    name: home
