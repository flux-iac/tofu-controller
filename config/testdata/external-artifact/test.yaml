---
apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: helloworld
spec:
  sources:
  - alias: repo
    kind: GitRepository
    name: helloworld
  artifacts:
  - name: helloworld-module
    originRevision: "@repo"
    copy:
    - from: "@repo/*.tf"
      to: "@artifact/"
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: helloworld-external-artifact
spec:
  interval: 10s
  approvePlan: auto
  path: ./
  sourceRef:
    kind: ExternalArtifact
    name: helloworld-module
