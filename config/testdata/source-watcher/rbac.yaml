---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: source-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: source-watcher
rules:
- apiGroups:
  - source.extensions.fluxcd.io
  resources:
  - artifactgenerators
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - source.extensions.fluxcd.io
  resources:
  - artifactgenerators/finalizers
  - artifactgenerators/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - '*'
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: source-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: source-watcher
subjects:
- kind: ServiceAccount
  name: source-watcher
  namespace: tofu-system
